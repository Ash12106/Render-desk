services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "try { rs.status().ok } catch (e) { quit(1) }"']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mongosh --host mongo:27017 --quiet --eval "db.adminCommand('ping')";
        do sleep 2; done;
        mongosh --host mongo:27017 --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"

  krawl:
    image: ghcr.io/blessedrebus/krawl:v2.3.1
    container_name: krawl-honeypot
    restart: unless-stopped
    environment:
      CONFIG_LOCATION: /app/config.yaml
      KRAWL_MODE: standalone
      KRAWL_PORT: 5000
      KRAWL_DASHBOARD_PASSWORD: ${KRAWL_DASHBOARD_PASSWORD:?KRAWL_DASHBOARD_PASSWORD must be set}
      KRAWL_DASHBOARD_SECRET_PATH: ${KRAWL_DASHBOARD_SECRET_PATH:-/security-dashboard-secret}
    volumes:
      - ./krawl-config.yaml:/app/config.yaml:ro
      - krawl_data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://localhost:5000' +
          os.getenv('KRAWL_DASHBOARD_SECRET_PATH', '/security-dashboard-secret') +
          '/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/support-ops?replicaSet=rs0
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KRAWL_API_URL: http://krawl:5000
      KRAWL_DASHBOARD_PASSWORD: ${KRAWL_DASHBOARD_PASSWORD:?KRAWL_DASHBOARD_PASSWORD must be set}
      KRAWL_DASHBOARD_SECRET_PATH: ${KRAWL_DASHBOARD_SECRET_PATH:-/security-dashboard-secret}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  mongo_data:
  krawl_data:
