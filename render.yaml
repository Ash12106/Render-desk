services:
  - type: web
    name: krawl-honeypot
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /security-dashboard-secret/healthz
    dockerfilePath: ./Dockerfile.krawl
    envVars:
      - key: KRAWL_MODE
        value: standalone
      - key: KRAWL_PORT
        value: 5000
      - key: CONFIG_LOCATION
        value: /app/config.yaml
      - key: KRAWL_DASHBOARD_PASSWORD
        sync: false
      - key: KRAWL_DASHBOARD_SECRET_PATH
        value: /security-dashboard-secret

  - type: web
    name: support-ops-desk
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health/db
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: KRAWL_API_URL
        sync: false
      - key: KRAWL_DASHBOARD_PASSWORD
        sync: false
      - key: KRAWL_DASHBOARD_SECRET_PATH
        value: /security-dashboard-secret
